<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="0.55" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <rect width="512" height="512" rx="115" fill="url(#glow)"/>
  <!-- Rising sparkline: varavu (income) climbing over selavu (expense) dips -->
  <path d="M118 368 L212 244 L272 312 L382 176" fill="none" stroke="#ffffff"
        stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arrow ticks at the tip: up and to the right -->
  <path d="M306 176 H382 V252" fill="none" stroke="#ffffff"
        stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Baseline dot: today's entry -->
  <circle cx="118" cy="368" r="30" fill="#ffffff" opacity="0.35"/>
</svg>
